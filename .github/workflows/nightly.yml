name: Nightly feed refresh

on:
  schedule:
    # 9:00 UTC = 1am/2am Pacific (DST-dependent) — after the last LA
    # screenings of the night have started, before anyone's morning check.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install curl
        run: |
          if command -v curl >/dev/null; then curl --version | head -1; exit 0; fi
          apt-get -o Acquire::Retries=5 update -qq
          apt-get -o Acquire::Retries=5 install -qq -y curl >/dev/null

      - name: Generate feed
        run: swift run GenerateFeed

      - name: Commit and push if the feed changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "sticky-floors-bot"
          git config user.email "actions@github.com"
          git add docs/feed.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Nightly feed refresh"
          git push
